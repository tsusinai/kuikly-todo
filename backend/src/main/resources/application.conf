# 后端代理服务配置(默认值;实际取值以环境变量覆盖为准:
#   PORT / TENCENT_QUOTE_URL / TENCENT_TIMEOUT_MS / AI_PROVIDER)
service {
  port = 8080
  port = ${?PORT}
  tencentQuoteUrl = "http://qt.gtimg.cn/q="
  tencentQuoteUrl = ${?TENCENT_QUOTE_URL}
  tencentTimeoutMs = 5000
  tencentTimeoutMs = ${?TENCENT_TIMEOUT_MS}
  aiProvider = "rule"
  aiProvider = ${?AI_PROVIDER}
}
