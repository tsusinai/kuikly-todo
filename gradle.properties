#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx4096M"
# 本项目要求 JDK 17（AGP 8.x / Kotlin 2.1.x）。Gradle 会依次取 JAVA_HOME → PATH 上的 java，
# 所以**不要**在这里写死本机绝对路径——那会让别人 clone 后直接构建失败。
# 需要指定特定 JDK 时，用用户级配置（~/.gradle/gradle.properties）或命令行临时覆盖：
#   ./gradlew :shared:compileDebugKotlinAndroid -Dorg.gradle.java.home=/path/to/jdk-17
# org.gradle.java.home=C:/Program Files/Java/jdk-17
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.caching=true
#Kotlin
kotlin.code.style=official
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
#MPP
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.androidSourceSetLayoutVersion=2
ksp.incremental=false
